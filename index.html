
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bản đồ số 15 khu phố - Lái Thiêu</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
<header id="header">
  <div class="brand">LT</div>
  <div class="headtext">
    <div class="eyebrow">ỦY BAN NHÂN DÂN PHƯỜNG LÁI THIÊU</div>
    <h1>BẢN ĐỒ SỐ 15 KHU PHỐ</h1>
  </div>
</header>

<main id="main">
  <aside id="sidebar">
    <section class="sidebarTop">
      <div class="stats">
        <div class="stat"><strong id="pointTotal">15</strong><span>Điểm bản đồ</span></div>
        <div class="stat"><strong id="wardTotal">15</strong><span>Khu phố</span></div>
      </div>
      <input id="search" type="search" placeholder="Tìm khu phố..." autocomplete="off">
      <div class="filters">
        <button class="active" data-filter="all">Tất cả</button>
        <button data-filter="coords">Có tọa độ</button>
        <button data-filter="near">Gần tôi</button>
      </div>
    </section>

    <div class="listHeading">DANH SÁCH KHU PHỐ (<span id="count">15</span>)</div>
    <div id="list" aria-live="polite"></div>
    <button id="sidebarToggle" type="button" aria-label="Thu gọn danh sách">‹</button>
  </aside>

  <section id="mapWrap">
    <button id="sidebarOpen" type="button">☰ Danh sách</button>
    <div id="mapControls">
      <button data-layer="street">Bản đồ</button>
      <button data-layer="sat" class="active">Vệ tinh</button>
      <button data-layer="terrain">Địa hình</button>
    </div>
    <div id="map"></div>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>
</body>
</html>
