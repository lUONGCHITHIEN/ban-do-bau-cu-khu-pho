
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bản đồ số 15 khu phố - Lái Thiêu</title>

  <link rel="stylesheet" href="style.css">

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >
</head>
<body>

<div id="app">

  <aside id="sidebar">
    <div class="header">
      <div class="headerLogo">LT</div>
      <div>
        <h1>PHƯỜNG LÁI THIÊU</h1>
        <p>BẢN ĐỒ SỐ 15 KHU PHỐ</p>
      </div>
      <button id="sidebarToggle" title="Thu gọn danh sách">‹</button>
    </div>

    <div class="searchBox">
      <input id="search" type="search" placeholder="Tìm khu phố...">
    </div>

    <div class="summary">
      <div class="summaryNumber" id="count">15</div>
      <div>
        <b>Khu phố</b>
        <small>Danh sách điểm trên bản đồ</small>
      </div>
    </div>

    <div class="filters">
      <button class="active" data-filter="all">Tất cả</button>
      <button data-filter="coords">Có tọa độ</button>
      <button data-filter="near">Gần tôi</button>
    </div>

    <div id="list"></div>

    <div class="sidebarFooter">
      Bản đồ địa điểm 15 khu phố
    </div>
  </aside>

  <button id="sidebarOpen" title="Mở danh sách">☰ Danh sách</button>

  <main id="mapWrap">
    <div id="map"></div>

    <div id="mapControls">
      <button class="active" data-layer="sat">Vệ tinh</button>
      <button data-layer="street">Đường phố</button>
      <button data-layer="terrain">Địa hình</button>
    </div>

    <div class="mapTitle">
      <b>BẢN ĐỒ 15 KHU PHỐ</b>
      <span>PHƯỜNG LÁI THIÊU</span>
    </div>
  </main>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>
</body>
</html>
